[package]
name = "tapecpy"
version = "0.1.0"
edition = "2024"
description = "Linux-native LTFS tape tool (LTFSCopyTUI)"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
quick-xml = "0.41"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
